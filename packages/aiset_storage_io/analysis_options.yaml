# Analyzer configuration for aiset_storage_io.
# Mirrors the aiset_core strictness exactly (SPEC_.md amendment 37:
# any author builds with the same checks).
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_redundant_argument_values
    - prefer_final_locals
    - public_member_api_docs
    - unnecessary_parenthesis
